limit_req_zone $binary_remote_addr zone=product_writes:1m rate=12r/m;
limit_conn_zone $binary_remote_addr zone=product_active:1m;
server {
    listen 8443 ssl;
    server_name _;
    ssl_certificate /etc/alpha/cert.pem;
    ssl_certificate_key /etc/alpha/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    auth_basic "Business insights";
    auth_basic_user_file /etc/alpha/htpasswd;
    client_max_body_size 16k;
    access_log off;
    error_log /dev/stderr warn;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;
    location ~ ^/api/v1/(companies/[^/]+/analysis-runs|insights/[^/]+/(messages|questions))$ {
        limit_req zone=product_writes burst=3 nodelay;
        limit_conn product_active 1;
        proxy_pass http://web:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 125s;
    }
    location / {
        proxy_pass http://web:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 125s;
    }
}
